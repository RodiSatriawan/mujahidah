<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil &amp; Capaian - Mujahidah Shalihah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdf4f8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .frame-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    .apps-script-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .mobile-desktop-notice {
      display: none;
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      width: calc(100% - 24px);
      max-width: 540px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.28);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mobile-desktop-notice.show {
      display: flex;
    }

    .mobile-desktop-notice a {
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: 8px;
      background: #ec4899;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .direct-open-btn {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 999px;
      background-color: rgba(30, 41, 59, 0.9);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.24);
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div id="mobileDesktopNotice" class="mobile-desktop-notice">
    <span>Mode Desktop di HP membatasi klik tab di dalam frame. Buka mode penuh agar semua tab bisa diklik:</span>
    <a href="https://script.google.com/macros/s/AKfycbzzpO6VU80xt6gwNMHFGi-EqyZh7K57b0MQoOl6GDavW3HBoawB7pjpVK_PMpgUTmA/exec">
      Buka Penuh
    </a>
  </div>

  <div class="frame-wrapper">
    <iframe
      id="mujahidahFrame"
      class="apps-script-frame"
      src="https://script.google.com/macros/s/AKfycbzzpO6VU80xt6gwNMHFGi-EqyZh7K57b0MQoOl6GDavW3HBoawB7pjpVK_PMpgUTmA/exec"
      title="Profil &amp; Capaian - Mujahidah Shalihah"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"
      allow="clipboard-read; clipboard-write; fullscreen"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <a
      class="direct-open-btn"
      href="https://script.google.com/macros/s/AKfycbzzpO6VU80xt6gwNMHFGi-EqyZh7K57b0MQoOl6GDavW3HBoawB7pjpVK_PMpgUTmA/exec"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>Buka Penuh</span>
      <span aria-hidden="true">↗</span>
    </a>
  </div>

  <script>
    (function () {
      var isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      var isDesktopScaledViewport = window.innerWidth >= 768;
      if (isMobileDevice && isDesktopScaledViewport) {
        var notice = document.getElementById('mobileDesktopNotice');
        if (notice) {
          notice.classList.add('show');
        }
      }
    })();
  </script>
</body>
</html>
